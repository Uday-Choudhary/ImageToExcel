[theme]
base = "dark"

# Deep navy app background
backgroundColor = "#0a0f1e"

# Slightly lighter secondary/sidebar
secondaryBackgroundColor = "#111827"

# Primary text — soft white for readability
textColor = "#e2e8f0"

# Electric blue accent
primaryColor = "#6366f1"

# Font (overridden via CSS anyway)
font = "sans serif"
